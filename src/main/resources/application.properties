spring.application.name=student-profile-system
server.port=8080

# ---- MySQL (XAMPP defaults: user=root, empty password, port 3306) ----
# Database "student_skill_db" is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/student_skill_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" creates the tables automatically if they are missing
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Console menu (Q2) ----
# true  = menu-driven program runs in the Eclipse Console
# false = only the REST API runs
app.menu.enabled=true
